[package]
name = "immersion-dashboard"
version = "1.0.0"
description = "A private dashboard for Japanese immersion"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[lib]
name = "immersion_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
